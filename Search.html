<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search & Sort - Movie DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Navbar placeholder -->
    <span id="navbar-placeholder"></span>
<!-- Page Header -->   
    <div class="position-relative overflow-hidden rounded mb-4 cinema-header-wrap">
    <img src="./images/cinema-header.jpg" alt="Cinema seating and screen" class="w-100 h-100 object-fit-cover position-absolute top-0 start-0">
    <h1 class="position-relative m-0 cinema-header-title">🎬 Movie DB 🎥</h1>
</div>

    <!-- Main page content --> 
    <main class="container my-4"> 
     
        <!-- Section for search and sort -->
        <section class="search-sort mb-4">
            <h2>Movie Search &amp; Sort</h2>
            <form id="form-list-control">
                <div class="mb-3">      
                    <input type="text" class="form-control w-50" placeholder="Enter movie ID or title" id="search-string">
                </div>
                <!-- Buttons to run search and sort functions -->
                <div class="mb-3">
                    <button type="button" class="btn btn-primary" name="btn-search" id="searchBtn">Search</button>
                    <button type="button" class="btn btn-secondary" name="btn-a2z" id="sortA2ZBtn">Sort (A-Z)</button>
                    <button type="button" class="btn btn-secondary" name="btn-z2a" id="sortZ2ABtn">Sort (Z-A)</button>
                    <button type="button" class="btn btn-secondary" id="sortRatingZ2ABtn">Rating (High-Low)</button>
                    <button type="button" class="btn btn-secondary refresh-btn">Refresh List</button>
                </div>
            </form>
        </section>

        <!-- Movie List table -->
        <section id="mList" class="mb-4">
            <h2>All Movies</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Title</th>
                            <th scope="col">Year</th>
                            <th scope="col">Rating</th>
                        </tr>
                    </thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </section>
    </main>
    <!-- Footer -->
    <footer class="text-center py-3">
        <div>
            <p>Copyright &copy; <span id="date"></span> Movie DB</p>
        </div>
    </footer>

    <!-- JavaScript Files -->
    <script src="./js/Movie-list.js"></script>
    <script src="./js/app.js"></script>

    <!-- Navbar Script -->
    <script> 
        fetch('Navbar.html')
            .then(response => response.text()) 
            .then(html => { 
                document.getElementById('navbar-placeholder').innerHTML = html;  
            })
            .catch(error => console.error('Navbar unable to load!', error));
    </script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>   
</body>
</html>
