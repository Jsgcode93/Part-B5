<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<span id="navbar-placeholder"></span>

<!-- Main page content --> 
<main class="container my-4"> 
    <!-- Page Header -->   
    <h1 class="mb-4">&#127916; Movie DB &#127909;</h1>

    <!-- Movie List table -->
    <section id="mList" class="mb-4">
        <h2>All Movies</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Title</th>
                        <th scope="col">Genre</th>
                        <th scope="col">Year</th>
                        <th scope="col">Rating</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </section>

    <!-- Tabs --> 
<section class="tab mb-4">
    <button type="button" class="tablinks" onclick="openForm(event, 'Add')" id="defaultOpen">Add a New Movie</button>
    <button type="button" class="tablinks" onclick="openForm(event, 'Update')">Update a Movie</button>
    <button type="button" class="tablinks" onclick="openForm(event, 'Delete')">Delete a Movie</button>
</section>

    <!-- Add Movie Section -->
    <section id="Add" class="tabcontent card p-4 mb-4 shadow-sm">        
        <h3 class="h4 mb-3">Add a Movie</h3>
        <form id="form-add">
            <div class="mb-3">
                <label for="addTitle" class="form-label">Title</label>
                <input type="text" class="form-control" placeholder="Movie title..." name="title" id="addTitle" required>
            </div>
            <div class="mb-3">
                <label for="addYear" class="form-label">Year</label>
                <input type="number" class="form-control" placeholder="Release year..." name="year" id="addYear" required>
            </div>
            <div class="mb-3">
                <label for="addRating" class="form-label">Rating (0-10)</label>
                <input type="number" step="0.1" class="form-control" placeholder="Rating..." name="rating" id="addRating" required>
            </div>
            <button type="button" class="btn btn-success" id="addSubmit">Add Movie</button>
            <button type="button" class="btn btn-secondary refresh-btn">Refresh List</button>
        </form>
    </section>
    
    <!-- Update Movie Section -->
    <section id="Update" class="tabcontent card p-4 mb-4 shadow-sm" style="display: none;">
        <h3 class="h4 mb-3">Update a Movie</h3>
        <form id="form-update">
            <div class="mb-3">
                <label for="upIndex" class="form-label">Movie Index / ID</label>
                <input type="number" class="form-control" placeholder="Index..." name="index" id="upIndex" required>
            </div>
            <div class="mb-3">
                <label for="upTitle" class="form-label">New Title</label>
                <input type="text" class="form-control" placeholder="New title..." name="title" id="upTitle" required>
            </div>
            <div class="mb-3">
                <label for="upYear" class="form-label">New Year</label>
                <input type="number" class="form-control" placeholder="New year..." name="year" id="upYear" required>
            </div>
            <button type="button" class="btn btn-warning" id="updateSubmit">Update Movie</button>
            <button type="button" class="btn btn-secondary refresh-btn">Refresh List</button>
        </form>
    </section>

    <!-- Delete movie -->
    <section id="Delete" class="tabcontent card p-4 mb-4 shadow-sm" style="display: none;">    
        <h3 class="h4 mb-3">Delete a Movie</h3>
        <form id="form-delete">
            <div class="mb-3">
                <label for="delIndex" class="form-label">Movie Index / ID</label>
                <input type="number" class="form-control" placeholder="Index to delete..." name="index" id="delIndex" required>
            </div>
            <button type="button" class="btn btn-danger" id="deleteSubmit">Delete Movie</button>
            <button type="button" class="btn btn-secondary refresh-btn">Refresh List</button>
        </form>
    </section>
</main>  

<!-- JavaScript Files -->
<script src="./js/Movie-list.js"></script>
<script src="./js/app.js"></script>

<!-- Navbar Script -->
<script> 
    fetch('Navbar.html')
        .then(response => response.text()) 
        .then(html => { 
            document.getElementById('navbar-placeholder').innerHTML = html;  
        })
        .catch(error => console.error('Navbar unable to load!', error));
</script>

<!-- Bootstrap Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>   
</body>
</html>
